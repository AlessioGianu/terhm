# terhm configuration (shell file, read with "source").
# Model profile: nl2sh or qwen3.5-4b (set by install.sh; rerun it to switch, since the
# server must load the other model). Sampling values below default per profile.
# TERHM_HOST=127.0.0.1
# TERHM_PORT=11500
# TERHM_TIMEOUT=20          # max seconds to wait for the model
# TERHM_FILES=40            # how many entries of the current directory to send as context
# TERHM_TEMPERATURE=0       # 0 = always the same answer (recommended)
# TERHM_REPEAT_PENALTY=1.08 # nl2sh 1.08, qwen 1.0
# TERHM_TOP_K=40            # nl2sh 40, qwen 20
# TERHM_TOP_P=0.9           # nl2sh 0.9, qwen 0.8
# TERHM_N_PREDICT=64        # max tokens of the answer: nl2sh 64, qwen 160
# TERHM_NO_THINK=1          # qwen: turn off thinking mode (much faster)
# TERHM_PROJECT_CONTEXT=1   # send make targets, npm scripts, compose services, ROS 2 workspace...
# TERHM_TOOLS_CONTEXT=1     # send the list of installed developer tools
# TERHM_RETRIES=2           # new attempts if the command uses missing programs or has syntax errors
# TERHM_CHECK=1             # 0 = do not check the command before proposing it
# Automatic retry: if you run a proposed command and it fails, the fix appears on the
# next command line (it is not executed). Set these BEFORE sourcing the plugin.
#   TERHM_AUTOFIX=1  TERHM_AUTOFIX_MAX=3
# Regex (ERE) of commands to flag as dangerous:
# TERHM_DANGEROUS='(^|[;&|[:space:]])(sudo|dd|mkfs)([[:space:]]|$)|rm[[:space:]]+-[a-zA-Z]*[rf]'
# Hotkey: set it BEFORE sourcing the plugin in your rc file
#   zsh:  TERHM_KEY='^G'      bash: TERHM_KEY='\C-g'      fish: set -g TERHM_KEY \cg
