# terhm configuration (shell file, read with "source").
# Online model: Gemini. The API key is in ~/.config/terhm/gemini.key (written by
# install.sh, readable only by you); GEMINI_API_KEY in the environment works too.
# Offline backup model: nl2sh-1.5b on a local llama-server, used when Gemini fails.
# TERHM_MODE=auto           # auto = Gemini, offline model if Gemini fails; online; offline
# TERHM_GEMINI_MODEL=gemini-3.5-flash-lite
# TERHM_GEMINI_TIMEOUT=15   # seconds to wait for Gemini before using the offline model
# TERHM_OFFLINE=1           # set by install.sh: 0 = the offline model is not installed
# TERHM_HOST=127.0.0.1      # offline model server
# TERHM_PORT=11500
# TERHM_TIMEOUT=20          # max seconds to wait for the offline model
# TERHM_FILES=40            # how many entries of the current directory to send as context
# TERHM_TEMPERATURE=0       # offline model: 0 = always the same answer (recommended)
# TERHM_REPEAT_PENALTY=1.08 # offline model sampling (nl2sh model card)
# TERHM_TOP_K=40
# TERHM_TOP_P=0.9
# TERHM_N_PREDICT=64        # offline model: max tokens of the answer
# TERHM_PROJECT_CONTEXT=1   # send make targets, npm scripts, compose services, ROS 2 workspace...
# TERHM_TOOLS_CONTEXT=1     # send the list of installed developer tools
# TERHM_RETRIES=2           # new attempts if the command uses missing programs or has syntax errors
# TERHM_CHECK=1             # 0 = do not check the command before proposing it
# Automatic retry: if you run a proposed command and it fails, the fix appears on the
# next command line (it is not executed). Set these BEFORE sourcing the plugin.
#   TERHM_AUTOFIX=1  TERHM_AUTOFIX_MAX=3
# Regex (ERE) of commands to flag as dangerous:
# TERHM_DANGEROUS='(^|[;&|[:space:]])(sudo|dd|mkfs)([[:space:]]|$)|rm[[:space:]]+-[a-zA-Z]*[rf]'
# Hotkey: set it BEFORE sourcing the plugin in your rc file
#   zsh:  TERHM_KEY='^G'      bash: TERHM_KEY='\C-g'      fish: set -g TERHM_KEY \cg
